<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchlist ANIME</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>Watchlist ANIME</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="anime-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- アニメ入力エリア -->
      <form id="anime-form" class="input-area">
        <input
          type="text"
          id="anime-input"
          class="anime-input"
          placeholder="新しいANIMEを入力..."
          maxlength="100"
          autocomplete="off"
        />
        <button type="submit" class="anime-button">追加</button>
      </form>

      <!-- アニメリスト -->
      <ul id="anime-list" class="anime-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 Watchlist ANIME</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
